[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dllm-agent"
version = "0.1.0"
description = "Dependency-light reference agent loop for dLLM/AR experimentation"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.scripts]
dllm-agent = "dllm_final.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
